<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scan Caju – QR Code Scanner</title>
  <meta name="description" content="QR code scanner and barcode reader. Scan with camera or album, create QR codes, history stays on your device.">
  <link rel="canonical" href="https://cute-satsuma.github.io/qr_scanner/">
  <style>
    :root { --accent:#E65100; --bg:#fff8f0; --text:#3e2723; --muted:#6d4c41; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
    .wrap { max-width:720px; margin:0 auto; padding:48px 20px 64px; }
    h1 { color:var(--accent); margin:0 0 8px; font-size:2rem; }
    p { color:var(--muted); }
    a { color:var(--accent); }
    .card { background:#fff; border-radius:16px; padding:24px; box-shadow:0 8px 24px rgba(62,39,35,.08); margin-top:24px; }
    ul { padding-left:1.2em; }
    .links a { display:inline-block; margin-right:16px; margin-top:12px; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>QR Scan Caju</h1>
    <p>QR code scanner and barcode reader by Cute-Satsuma (Caju).</p>
    <div class="card">
      <ul>
        <li>Scan QR and barcodes with the camera or from your album</li>
        <li>Create QR codes for text, URL, Wi-Fi, phone and email</li>
        <li>History stays on this device</li>
      </ul>
      <div class="links">
        <a href="https://cute-satsuma.github.io/privacy/qr-scan-caju/">Privacy Policy</a>
        <a href="https://play.google.com/store/apps/details?id=com.bytemyth.qr_scanner">Google Play</a>
      </div>
    </div>
  </div>
</body>
</html>
